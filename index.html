<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to co cai nay cho cau ne</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #05020a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Dancing Script', cursive;
            perspective: 1000px;
        }

        /* Phông nền sao lấp lánh */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            background: radial-gradient(ellipse at bottom, #1b021a 0%, #05020a 100%);
            z-index: 0;
        }

        /* Container chứa hiệu ứng trái tim 3D */
        .ui {
            position: relative;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            /* ĐÃ SỬA: Tăng từ 25s lên 50s để quay toàn bộ khối 3D chậm lại */
            animation: rotateWorld 50s infinite linear;
            z-index: 1;
            cursor: grab;
        }

        .ui:active {
            cursor: grabbing;
        }

        @keyframes rotateWorld {
            0% {
                transform: rotateX(-10deg) rotateY(0deg);
            }
            100% {
                transform: rotateX(-10deg) rotateY(360deg);
            }
        }

        /* Cấu trúc các thẻ chữ */
        .love {
            position: absolute;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .love_word {
            position: absolute;
            white-space: nowrap;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff2a75;
            text-shadow: 
                0 0 5px #ff2a75,
                0 0 10px #ff2a75,
                0 0 20px #ff0055,
                0 0 40px #ff0055;
            user-select: none;
            backface-visibility: visible;
            transform: translate(-50%, -50%);
        }

        /* Tiêu đề */
        .title {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-size: 2rem;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px #ff0055;
            z-index: 10;
            pointer-events: none;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .love_word {
                font-size: 1.1rem;
            }
            .title {
                font-size: 1.5rem;
                top: 20px;
            }
        }
    </style>
</head>
<body>
    <audio id="bg-music" loop src="iloveyou3000.mp3"></audio>
    
    <!-- BACKGROUND -->
    <div class="stars"></div>

    <!-- TITLE -->
    <div class="title">I Love You 3000 ❤</div>

    <!-- MAIN UI CONTAINER -->
    <div class="ui" id="ui"></div>

    <script>
        // Tự động phát nhạc khi người dùng tương tác
        function playMusicOnUserInteraction() {
            const music = document.getElementById('bg-music');
            music.play().then(() => {
                document.removeEventListener('click', playMusicOnUserInteraction);
                document.removeEventListener('touchstart', playMusicOnUserInteraction);
            }).catch(err => {
                console.log("Trình duyệt chặn phát tự động nhạc:", err);
            });
        }

        document.addEventListener('click', playMusicOnUserInteraction);
        document.addEventListener('touchstart', playMusicOnUserInteraction);

        const ui = document.getElementById("ui");
        const totalItems = 60; // Số lượng dòng chữ "I love you" trên quỹ đạo
        const elements = [];
        const scale = 14;      // Kích thước hình trái tim
        
        /* ĐÃ SỬA: Giảm tốc độ chạy của chữ theo quỹ đạo xuống 0.0008 (chậm nhẹ nhàng) */
        const speed = 0.0008;   
        let globalOffset = 0;

        // Tạo các phần tử chữ
        for (let i = 0; i < totalItems; i++) {
            const love = document.createElement("div");
            love.className = "love";
            
            const word = document.createElement("div");
            word.className = "love_word";
            word.textContent = "I love you";
            
            love.appendChild(word);
            ui.appendChild(love);
            
            elements.push({
                element: love,
                baseProgress: i / totalItems
            });
        }

        // Hàm tính toán vị trí theo phương trình tham số trái tim 3D
        function getHeartPoint(t) {
            const angle = t * Math.PI * 2;
            // Công thức trái tim toán học
            const x = 16 * Math.pow(Math.sin(angle), 3);
            const y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));
            const z = Math.sin(angle) * 80;
            
            return {
                x: x * scale,
                y: y * scale,
                z: z
            };
        }

        // Vòng lặp Animation liên tục di chuyển chữ theo quỹ đạo trái tim
        function animate() {
            globalOffset += speed;
            if (globalOffset >= 1) globalOffset -= 1;

            elements.forEach((item) => {
                let currentProgress = (item.baseProgress + globalOffset) % 1;
                let pt = getHeartPoint(currentProgress);
                
                // Góc xoay nhẹ tạo hiệu ứng 3D
                let rotY = currentProgress * 360;
                
                item.element.style.transform = `translate3d(${pt.x}px, ${pt.y}px, ${pt.z}px) rotateY(${rotY}deg)`;
            });

            requestAnimationFrame(animate);
        }

        animate();

        // Tương tác xoay hình 3D bằng chuột / cảm ứng
        let isMouseDown = false;
        let startX, startY;
        let currentRotX = -10;
        let currentRotY = 0;

        window.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            startX = e.clientX;
            startY = e.clientY;
            ui.style.animation = 'none';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;

            currentRotY += deltaX * 0.5;
            currentRotX -= deltaY * 0.5;

            ui.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;

            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            if (isMouseDown) {
                isMouseDown = false;
                /* ĐÃ SỬA: Đảm bảo thời gian giữ nguyên 50s sau khi thả chuột */
                ui.style.animation = 'rotateWorld 50s infinite linear';
            }
        });

        // Hỗ trợ sự kiện Vuốt màn hình điện thoại
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isMouseDown = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                ui.style.animation = 'none';
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isMouseDown || e.touches.length !== 1) return;
            const deltaX = e.touches[0].clientX - startX;
            const deltaY = e.touches[0].clientY - startY;

            currentRotY += deltaX * 0.5;
            currentRotX -= deltaY * 0.5;

            ui.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;

            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', () => {
            if (isMouseDown) {
                isMouseDown = false;
                /* ĐÃ SỬA: Đảm bảo thời gian giữ nguyên 50s sau khi thả cảm ứng */
                ui.style.animation = 'rotateWorld 50s infinite linear';
            }
        });
    </script>
</body>
</html>
